query GetReminders(
	$categoryId: UUID
	$first: Int
	$last: Int
	$after: Cursor
	$before: Cursor
) @cache(policy: NetworkOnly) {
	upcomingReminders: reminderCollection(
		filter: {
			type: { eq: ONGOING }
			auto_renewal: { eq: true }
			category_id: { eq: $categoryId }
		}
	) {
		list: edges {
			reminder: node {
				auto_renewal
				started_at
				created_at
				frequency
				type
				id
				name
				cost
				day
				month
				auto_renewal
				category {
					id
					icon_id
					name
				}
			}
		}
	}
	reminders: reminderCollection(
		first: $first
		last: $last
		after: $after
		before: $before
		filter: { category_id: { eq: $categoryId } }
	) {
		pageInfo {
			startCursor
			endCursor
			hasPreviousPage
			hasNextPage
		}
		list: edges {
			reminder: node {
				started_at
				created_at
				frequency
				type
				id
				name
				cost
				category {
					id
					icon_id
					name
				}
			}
		}
	}
}
