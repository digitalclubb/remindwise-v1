query getReminder($slug: BigInt) @load {
	reminders: remindersCollection(filter: { id: { eq: $slug } }) {
		list: edges {
			reminder: node {
				id
				name
				type
				company
				cost
				date
				frequency
				autoRenewal
				notes
				category {
					id
					name
					iconId
				}
			}
		}
	}
}
