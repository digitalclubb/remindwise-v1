query GetReminder($slug: UUID) @cache(policy: NetworkOnly) {
	reminders: reminderCollection(filter: { id: { eq: $slug } }) {
		list: edges {
			reminder: node {
				id
				name
				type
				cost
				day
				month
				frequency
				auto_renewal
				notes
				started_at
				category {
					id
					name
					icon_id
				}
			}
		}
	}
}
