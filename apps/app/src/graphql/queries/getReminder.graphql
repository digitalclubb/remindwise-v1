query GetReminder($slug: BigInt) @load {
	reminders: reminderCollection(filter: { id: { eq: $slug } }) {
		list: edges {
			reminder: node {
				id
				name
				type
				company
				cost
				day
				month
				frequency
				auto_renewal
				notes
				category {
					id
					name
					icon_id
				}
			}
		}
	}
}
