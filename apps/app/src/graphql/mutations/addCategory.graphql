mutation addCategory(
	$category: String!
	$isLocked: Boolean!
	$iconId: String!
	$userId: uuid!
) {
	insertIntocategoriesCollection(
		objects: [
			{ name: $category, isLocked: $isLocked, iconId: $iconId, userid: $userId }
		]
	) {
		affectedCount
		records {
			id
			name
			isLocked
			iconId
			userid
		}
	}
}
