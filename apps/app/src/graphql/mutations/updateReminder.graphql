mutation UpdateReminder(
	$id: UUID
	$categoryId: UUID!
	$name: String!
	$type: Type!
	$company: String
	$cost: Float
	$day: Int
	$month: Int
	$frequency: Frequency
	$autoRenewal: Boolean
	$notes: String
) {
	updateReminderCollection(
		filter: { id: { eq: $id } }
		set: {
			category_id: $categoryId
			name: $name
			type: $type
			company: $company
			cost: $cost
			day: $day
			month: $month
			frequency: $frequency
			auto_renewal: $autoRenewal
			notes: $notes
		}
	) {
		affectedCount
	}
}
