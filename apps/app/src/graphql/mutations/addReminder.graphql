mutation addReminder(
	$categoryId: BigInt
	$company: String!
	$cost: Float
	$dateOfRenewal: Date
	$autoRenewal: Boolean
	$notes: String
	$userid: UUID!
	$enabled: Boolean
) {
	insertIntoremindersCollection(
		objects: [
			{
				company: $company
				cost: $cost
				dateOfRenewal: $dateOfRenewal
				categoryId: $categoryId
				autoRenewal: $autoRenewal
				userid: $userid
				notes: $notes
				enabled: $enabled
			}
		]
	) {
		affectedCount
		records {
			id
			company
		}
	}
}
