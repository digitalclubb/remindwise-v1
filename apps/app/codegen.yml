schema:
  - '${PUBLIC_SUPABASE_URL}/graphql/v1':
      headers:
        apiKey: '${PUBLIC_SUPABASE_KEY}'
documents:
  - '**/*.{graphql,gql}'
generates:
  src/graphql/types.ts:
    plugins:
      - typescript
      - typescript-operations
      - typed-document-node
    config:
      useTypeImports: true
